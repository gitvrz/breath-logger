; Small standalone test, not the Breath Logger firmware: reads the LPS28DFW (pressure),
; LSM6DSM (accelerometer + gyroscope) and DS1307 (clock) on the I2C bus and prints
; their values on the USB port. See README.md in this folder.
; Build:  pio run          -> .pio/build/sensortest/firmware.bin

[env:sensortest]
platform = espressif32@^7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
