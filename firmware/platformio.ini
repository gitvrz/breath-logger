; PlatformIO project: Breath Logger firmware (Seeed XIAO ESP32-S3). See docs/development.md.
; Build:  pio run          Flash:  pio run -t upload          Monitor:  pio device monitor

[env:esp32s3]
platform = espressif32@^7.1.3
; The DevKitC profile fits the XIAO ESP32-S3 for all we use (8 MB flash, native USB)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Don't toggle DTR/RTS when opening the monitor: on the native USB port that can reset the chip.
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ; WebSockets (links2004, 2.7.3) is in lib/WebSockets with a fix: see lib/WebSockets/PATCHED.md
; Packs ../webapp into src/webapp_files.h: the device serves the page over Wi-Fi.
; Writes src/build_info.cpp: version, build date and git commit of this firmware.
extra_scripts =
    pre:embed_webapp.py
    pre:build_info.py
build_flags =
    ; "Serial" = the native USB port (the XIAO's USB-C)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; No core debug logs on the USB port: it carries our JSON protocol
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_USE_LONG_LONG=1
    ; WebSocket library: give up on a stuck send after 0.5 s instead of 5 s (net.cpp)
    -DWEBSOCKETS_TCP_TIMEOUT=500

; Test only: a firmware that crashes 5 s after starting, to check that a failed update
; goes back to the previous firmware by itself (tools/otatest.py --crash). Build it with
;   pio run -e crash-test     -> .pio/build/crash-test/firmware.bin
[env:crash-test]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DOTA_CRASH_TEST=1
