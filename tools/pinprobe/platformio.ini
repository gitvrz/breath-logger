; Passive pin scan, for finding how a peripheral (e.g. the SD card slot) is wired on a
; board without its schematic. Every pin stays an INPUT: nothing is ever driven.
; Build/flash like the main firmware, then flash the main firmware back afterwards.
[env:esp32s3]
platform = espressif32@^7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
