; SD card probe for the XIAO ESP32-S3 board: finds which pin is the SD card CS.
; SPI pins are the XIAO defaults (SCK D8=GPIO7, MISO D9=GPIO8, MOSI D10=GPIO9).
; Only the CS candidates and the 3 SPI pins are driven. Flash the main firmware back afterwards.
[env:esp32s3]
platform = espressif32@^7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
